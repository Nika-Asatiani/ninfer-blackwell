events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Support WebSockets for noVNC
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8000;
        listen [::]:8000;
        server_name _;

        client_max_body_size 500M;

        # 1. Root: Directly serve noVNC without redirect
        location = / {
            root /usr/share/novnc;
            try_files /vnc.html =404;
        }

        # 2. noVNC Static Web Assets
        location / {
            root /usr/share/novnc;
            index vnc.html;
            try_files $uri $uri/ =404;
        }

        # 3. noVNC WebSocket Stream
        location /websockify {
            proxy_pass http://127.0.0.1:6080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 4. ttyd Instant Web Terminal (Interactive Root Shell)
        location ^~ /terminal/ {
            proxy_pass http://127.0.0.1:7681/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 4. OpenAI Compatible LLM API (NInfer Backend)
        location /v1/ {
            proxy_pass http://127.0.0.1:8080/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # 5. Health Check Endpoint for Salad Gateway
        location = /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
